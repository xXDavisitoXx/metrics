name: Metrics
on:
  # Se ejecuta automáticamente todos los días a las 00:00 UTC
  schedule: [{cron: "0 0 * * *"}]
  # Permite que lo lances a mano desde la pestaña Actions cuando quieras
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      <div align="center">
        - name: General analytics
          uses: lowlighter/metrics@latest
          with:
            # Aquí va el nombre de tu secret (el token)
            token: ${{ secrets.METRICS_TOKEN }}
            
            # Opciones de tu perfil
            user: xXDavisitoXx
            template: classic
            base: header, activity, community, repositories, metadata
            config_timezone: Europe/Madrid
            
            # Plugins activos (los que tenías antes)
            plugin_languages: yes
            plugin_languages_sections: most-used
            plugin_languages_details: percentage
            plugin_followup: yes
            plugin_followup_sections: repositories
